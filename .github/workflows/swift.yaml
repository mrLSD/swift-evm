# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - configuration: cryptoswift-disabled
          swift_flags: "--disable-default-traits"
        - configuration: cryptoswift-basic
          swift_flags: "--traits Tracing"
        - configuration: cryptoswift-full
          swift_flags: "--traits TraceCallTrace,TraceGasCalculation,TraceStackInOut,TraceHideUnchanged,TraceHideMemory,TraceHideStack,TraceHideStorage,TraceStorageHexValue,TraceOpcodeHexValue"
        - configuration: tiny-keccak-disabled
          swift_flags: "--traits TinyKeccak"
        - configuration: tiny-keccak-basic
          swift_flags: "--traits TinyKeccak,Tracing"
        - configuration: tiny-keccak-full
          swift_flags: "--traits TinyKeccak,TraceCallTrace,TraceGasCalculation,TraceStackInOut,TraceHideUnchanged,TraceHideMemory,TraceHideStack,TraceHideStorage,TraceStorageHexValue,TraceOpcodeHexValue"
    steps:
    - uses: actions/checkout@v4

    # Use the Swift toolchain bundled with the image's default Xcode: a
    # standalone toolchain may be older than the SDK and fail to parse it.
    - name: Show Swift version
      run: |
        xcodebuild -version
        swift --version

    - name: Build
      run: swift build ${{ matrix.swift_flags }}

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: swiftlint

    - name: Run tests
      run: swift test --verbose --enable-code-coverage ${{ matrix.swift_flags }}

    - name: Generate Coverage Report
      run: |
        mkdir -p coverage
        BIN_PATH=$(swift build --show-bin-path)
        TEST_BUNDLE=$(find "$BIN_PATH" -name "*.xctest" | head -n 1)
        BINARY_NAME=$(basename "$TEST_BUNDLE" .xctest)
        BINARY_PATH="$TEST_BUNDLE/Contents/MacOS/$BINARY_NAME"
        echo "Binary path found: $BINARY_PATH"
        xcrun llvm-cov export -format="lcov" "$BINARY_PATH" \
          -instr-profile="$BIN_PATH/codecov/default.profdata" \
          -ignore-filename-regex="\.build|Tests" \
          > coverage/lcov.info
        ls -la coverage/lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}      
      with:
        files: coverage/lcov.info
        flags: swift
        name: codecov-${{ matrix.configuration }}
        fail_ci_if_error: true

  # Release-mode Keccak-256 check with the one-GiB KAT vector, which the debug suite skips.
  keccak:
    name: Keccak 1 GiB (${{ matrix.backend }})
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - backend: CryptoSwift
          swift_flags: "--disable-default-traits"
        - backend: TinyKeccak
          swift_flags: "--traits TinyKeccak"
    steps:
    - uses: actions/checkout@v4

    - name: Show Swift version
      run: |
        xcodebuild -version
        swift --version

    - name: Run release Keccak tests including the one-GiB vector
      shell: bash
      env:
        EVM_KECCAK_EXTREMELY_LONG_KAT: "1"
      run: |
        set -euo pipefail
        # The shared test bundle uses @testable imports, including in release builds.
        swift build --build-tests -c release -Xswiftc -enable-testing ${{ matrix.swift_flags }}
        BIN_PATH=$(swift build --show-bin-path -c release ${{ matrix.swift_flags }})
        xcrun xctest -XCTest EVMCryptoTests.Keccak256Spec "$BIN_PATH/SwiftEVMPackageTests.xctest" \
          2>&1 | tee "$RUNNER_TEMP/keccak-tests.log"
        # Quick discovers examples at runtime; require proof that the opt-in test actually ran.
        grep -E "Test Case .*matches ExtremelyLongMsgKAT_256 for one GiB.* passed" "$RUNNER_TEMP/keccak-tests.log"
